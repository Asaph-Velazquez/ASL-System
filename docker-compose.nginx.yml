services:
  asl-model-server:
    build:
      context: ./ASL-ModelServer
    env_file:
      - ./ASL-Web/server/.env
    environment:
      MONGODB_URI: mongodb://host.docker.internal:27017/asl-hotel
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx-gateway:
    image: nginx:1.27-alpine
    container_name: asl-nginx-gateway
    restart: unless-stopped
    ports:
      - "${ASL_GATEWAY_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      # Base de desarrollo local para Docker Desktop; puede requerir ajuste fuera de Windows/macOS.
      - "host.docker.internal:host-gateway"
    depends_on:
      - asl-model-server
