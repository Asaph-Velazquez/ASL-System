worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # No registrar tokens de WebSocket contenidos en query strings.
  log_format safe '$remote_addr $request_method $uri $status';
  access_log /var/log/nginx/access.log safe;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $http_x_forwarded_proto $external_proto { default $scheme; https https; }

  # Docker DNS: resolver otra vez si Compose recrea un backend.
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 80;
    server_name _;
    set $web http://asl-web-server:3001;
    set $call http://asl-call-server:3101;
    set $model http://asl-model-server:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $external_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location = /gateway-health { access_log off; return 200 'ok'; }
    location = /api/internal { return 404; }
    location ^~ /api/internal/ { return 404; }
    location ^~ /api/calls/internal/ { return 404; }
    location ^~ /api/asl/ {
      client_max_body_size 256k;
      proxy_connect_timeout 3s;
      proxy_read_timeout 12s;
      proxy_pass $model;
    }
    location = /api/interpreter { proxy_pass $call; }
    location ^~ /api/interpreter/ { proxy_pass $call; }
    location = /calls { proxy_pass $call; }
    location ~ ^/api/calls/[^/]+/report/?$ { proxy_pass $call; }
    location / { proxy_pass $web; }
  }
}
