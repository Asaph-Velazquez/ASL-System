worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # ngrok terminates TLS before forwarding HTTP to this development gateway.
  map $http_x_forwarded_proto $external_proto {
    default $scheme;
    https https;
    http http;
  }

  upstream asl_web_server {
    server host.docker.internal:3001;
    keepalive 32;
  }

  upstream asl_call_server {
    server host.docker.internal:3101;
    keepalive 32;
  }

  upstream asl_model_server {
    server asl-model-server:8000;
    keepalive 8;
  }

  server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $external_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location ^~ /api/asl/ {
      client_max_body_size 256k;
      proxy_connect_timeout 3s;
      proxy_read_timeout 12s;
      proxy_pass http://asl_model_server;
    }

    location = /api/internal { return 404; }
    location ^~ /api/internal/ { return 404; }

    location ^~ /api/interpreter/ {
      proxy_pass http://asl_call_server;
    }

    location = /api/interpreter {
      proxy_pass http://asl_call_server;
    }

    location = /calls {
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_pass http://asl_call_server;
    }

    location ~ ^/api/calls/[^/]+/report/?$ {
      proxy_pass http://asl_call_server;
    }

    location /api/calls/ {
      proxy_pass http://asl_web_server;
    }

    location / {
      proxy_pass http://asl_web_server;
    }
  }
}
